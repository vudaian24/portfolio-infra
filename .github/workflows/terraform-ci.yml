name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly drift check on main (plan only, never applied)
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep every run on main; cancel superseded runs on pull requests.
  # The apply job has its own group that never cancels (see below).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, envs/prod]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf-version
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      # -backend=false: no AWS credentials needed in CI for static checks
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  trivy:
    name: Trivy config
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned release binary, verified against the published SHA-256 checksums
      - name: Install trivy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: trivy config
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .terraform .

  # Plan on push to main and on the weekly schedule. It has no environment, so it runs without
  # approval. It assumes the plan role, which trusts only refs/heads/main (ADR 0008). The plan is
  # saved and passed to the apply job, which applies exactly this file.
  plan:
    name: Plan (envs/prod)
    needs: [fmt, validate, tflint, trivy]
    # Off until the first laptop apply has created the CI roles and the secrets are set
    # (README, Phase 2). The apply job needs this job, so it is skipped too.
    if: github.event_name != 'pull_request' && vars.TF_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Account values come from GitHub secrets, so the log masks them (names in the README)
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_tfstate_bucket_name: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_budget_email: ${{ secrets.TF_BUDGET_EMAIL }}
      TF_VAR_admin_principal_arn: ${{ secrets.TF_ADMIN_PRINCIPAL_ARN }}
      TF_VAR_admin_cidrs: ${{ secrets.TF_ADMIN_CIDRS }}
      # Read-only zone token for data sources. A repository secret, because this job has no environment.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PLAN }}
    defaults:
      run:
        working-directory: envs/prod
    steps:
      # GitHub masks each secret as a whole string only. The plan prints the admin CIDRs one by
      # one, so mask every element too.
      - name: Mask account values in the log
        # Runs before checkout, when envs/prod does not exist yet
        working-directory: .
        run: |
          for v in "$TF_VAR_aws_account_id" "$TF_STATE_BUCKET" "$TF_VAR_budget_email" "$TF_VAR_admin_principal_arn"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          jq -r '.[]' <<<"$TF_VAR_admin_cidrs" | while read -r cidr; do
            if [ -n "$cidr" ]; then echo "::add-mask::$cidr"; fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf-version
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: terraform init
        run: terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      # The apply role cannot write IAM or EKS access entries (envs/prod/ci.tf). Stop here
      # instead of failing halfway through an apply; the admin applies these from a laptop.
      - name: Stop on IAM or EKS access entry changes
        run: |
          addresses="$(terraform show -json tfplan | jq -r '
            .resource_changes[]?
            | select(.type | test("^aws_iam_|^aws_eks_access_"))
            | select(.change.actions != ["no-op"] and .change.actions != ["read"])
            | .address')"
          if [ -n "$addresses" ]; then
            echo "::error::this plan changes IAM or EKS access entries. Apply it from a laptop as the admin (README, Phase 2), then re-run."
            printf '%s\n' "$addresses"
            exit 1
          fi

      # The repository is public and a plan file holds variable values and attributes,
      # so only the encrypted plan is uploaded.
      - name: Encrypt the plan
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          if [ -z "$TF_PLAN_PASSPHRASE" ]; then
            echo "::error::secret TF_PLAN_PASSPHRASE is not set"
            exit 1
          fi
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output tfplan.gpg tfplan 3<<<"$TF_PLAN_PASSPHRASE"
          rm -f tfplan

      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: envs/prod/tfplan.gpg
          if-no-files-found: error
          retention-days: 1

  # Applies only the plan saved above, after a reviewer approves the production environment.
  # Its own concurrency group never cancels a running apply.
  apply:
    name: Apply (envs/prod)
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # No TF_VAR_* here: a saved plan carries its variable values, and apply rejects variable input.
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      # Environment secret of production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf-version
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ github.sha }}
          path: envs/prod

      - name: Decrypt the plan
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output tfplan tfplan.gpg 3<<<"$TF_PLAN_PASSPHRASE"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: terraform init
        run: terraform init -input=false -no-color -backend-config="bucket=${TF_STATE_BUCKET}"

      # Applies the saved plan file only, never a fresh plan
      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
